<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>404 - Page Not Found | FindEx Games</title>
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F5F7FA;
            --primary: #A8D8EA;
            --secondary: #C7F9CC;
            --accent: #F7D9C4;
            --shadow: rgba(0, 0, 0, 0.08);
            --purple: #6B46C1;
            --gold: #F59E0B;
            --text-dark: #2D3748;
            --text-light: #E5E7EB;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--primary) 50%, var(--secondary) 100%);
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .error-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 4rem 3rem;
            box-shadow: 0 20px 60px var(--shadow);
            border: 2px solid var(--primary);
        }

        .error-icon {
            font-size: 6rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--purple), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 2.5rem;
            color: var(--purple);
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            background: linear-gradient(135deg, var(--purple), var(--gold));
            color: white;
            font-size: 1.1rem;
            margin: 0.5rem;
        }

        .btn:hover {
            box-shadow: 0 10px 30px rgba(107, 70, 193, 0.4);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--purple);
            color: var(--purple);
        }

        .btn-outline:hover {
            background: var(--purple);
            color: white;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 2rem;
            }
            .error-message {
                font-size: 1rem;
            }
            .error-content {
                padding: 2rem 1.5rem;
            }
            .error-icon {
                font-size: 4rem;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 4rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .error-message {
                font-size: 0.9rem;
            }
            .error-content {
                padding: 1.5rem 1rem;
            }
            .error-icon {
                font-size: 3rem;
            }
            .btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
                display: block;
                width: 100%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">🚀</div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for seems to have drifted away. 
                It might have been moved, deleted, or never existed.
            </p>
            <p class="error-message" style="font-size: 1rem; margin-top: 1rem;">
                Don't worry, you can always return to our home base and continue your gaming adventure!
            </p>
            <div style="margin-top: 2rem;">
                <a href="index.html" class="btn">🏠 Return Home</a>
                <a href="games.html" class="btn btn-outline">🎰 Play Games</a>
            </div>
        </div>
    </div>
</body>
</html>
